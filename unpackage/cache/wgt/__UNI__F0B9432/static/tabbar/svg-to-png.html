<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 转 PNG - WanderAI TabBar 图标</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f7f8f6 0%, #e5eadf 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #131811;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #708961;
            margin-bottom: 40px;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .icon-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .icon-preview {
            width: 81px;
            height: 81px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-preview svg {
            width: 100%;
            height: 100%;
        }
        .icon-name {
            font-weight: 600;
            color: #131811;
            margin-bottom: 10px;
        }
        .download-btn {
            background: #63ec13;
            color: #131811;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
        .download-btn:active {
            transform: scale(0.95);
        }
        .bulk-download {
            text-align: center;
            margin-top: 40px;
        }
        .bulk-btn {
            background: #131811;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .bulk-btn:hover {
            transform: scale(1.05);
        }
        .status {
            text-align: center;
            margin-top: 20px;
            color: #708961;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 WanderAI TabBar 图标转换器</h1>
        <p class="subtitle">将 SVG 图标转换为 81x81 PNG 格式</p>

        <div class="icon-grid" id="iconGrid">
            <!-- 图标卡片将通过 JS 动态生成 -->
        </div>

        <div class="bulk-download">
            <button class="bulk-btn" onclick="downloadAll()">📦 打包下载所有图标</button>
        </div>
        <p class="status" id="status"></p>
    </div>

    <script>
        const icons = [
            { name: 'home', label: '首页' },
            { name: 'home-active', label: '首页（选中）' },
            { name: 'explore', label: '探索' },
            { name: 'explore-active', label: '探索（选中）' },
            { name: 'album', label: '相册' },
            { name: 'album-active', label: '相册（选中）' },
            { name: 'profile', label: '我的' },
            { name: 'profile-active', label: '我的（选中）' }
        ];

        // 加载 SVG 内容
        async function loadSVG(name) {
            const response = await fetch(`./${name}.svg`);
            return await response.text();
        }

        // SVG 转 PNG
        function svgToPng(svgString, size = 81) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const img = new Image();
                const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                img.onload = function() {
                    ctx.drawImage(img, 0, 0, size, size);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.src = url;
            });
        }

        // 下载单个图标
        async function downloadIcon(name) {
            const svg = await loadSVG(name);
            const png = await svgToPng(svg);

            const link = document.createElement('a');
            link.download = `${name}.png`;
            link.href = png;
            link.click();
        }

        // 下载所有图标
        async function downloadAll() {
            const status = document.getElementById('status');
            status.textContent = '正在准备下载...';

            for (const icon of icons) {
                const svg = await loadSVG(icon.name);
                const png = await svgToPng(svg);

                const link = document.createElement('a');
                link.download = `${icon.name}.png`;
                link.href = png;
                link.click();

                await new Promise(r => setTimeout(r, 200));
            }

            status.textContent = '✓ 所有图标下载完成！请将文件保存到 static/tabbar/ 目录';
            setTimeout(() => {
                status.textContent = '';
            }, 5000);
        }

        // 初始化图标卡片
        async function init() {
            const grid = document.getElementById('iconGrid');

            for (const icon of icons) {
                const svg = await loadSVG(icon.name);
                const card = document.createElement('div');
                card.className = 'icon-card';
                card.innerHTML = `
                    <div class="icon-preview">${svg}</div>
                    <div class="icon-name">${icon.label}</div>
                    <button class="download-btn" onclick="downloadIcon('${icon.name}')">
                        下载 PNG
                    </button>
                `;
                grid.appendChild(card);
            }
        }

        init();
    </script>
</body>
</html>
