<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="240" fill="#63ec13" opacity="0.1"/>

  <!-- 主圆形 - 地球 -->
  <circle cx="256" cy="256" r="140" stroke="#63ec13" stroke-width="12" fill="none"/>

  <!-- 航线弧线 -->
  <path d="M150 200 Q 256 140 362 200" stroke="#63ec13" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M150 312 Q 256 372 362 312" stroke="#63ec13" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M200 150 Q 140 256 200 362" stroke="#708961" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M312 150 Q 372 256 312 362" stroke="#708961" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 中心点 - 奇点/AI 核心 -->
  <circle cx="256" cy="256" r="24" fill="#63ec13"/>
  <circle cx="256" cy="256" r="40" stroke="#63ec13" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- 星点装饰 - 代表 AI 智能 -->
  <circle cx="180" cy="180" r="8" fill="#63ec13" opacity="0.8"/>
  <circle cx="332" cy="180" r="6" fill="#63ec13" opacity="0.6"/>
  <circle cx="180" cy="332" r="6" fill="#63ec13" opacity="0.6"/>
  <circle cx="332" cy="332" r="8" fill="#63ec13" opacity="0.8"/>
  <circle cx="256" cy="150" r="5" fill="#708961" opacity="0.7"/>
  <circle cx="256" cy="362" r="5" fill="#708961" opacity="0.7"/>

  <!-- 装饰性弧线 -->
  <circle cx="256" cy="256" r="180" stroke="#63ec13" stroke-width="3" fill="none" opacity="0.3" stroke-dasharray="20 10"/>

  <!-- 应用名称 -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="#131811">漫游奇点</text>
  <text x="256" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" text-anchor="middle" fill="#708961" letter-spacing="8">WanderAI</text>
</svg>
