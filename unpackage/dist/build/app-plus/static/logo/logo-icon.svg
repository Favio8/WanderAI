<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- 背景 - 圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#63ec13"/>

  <!-- 内部白色圆形 -->
  <circle cx="256" cy="256" r="160" fill="white" opacity="0.95"/>

  <!-- 地球轮廓 -->
  <circle cx="256" cy="256" r="120" stroke="#63ec13" stroke-width="10" fill="none"/>

  <!-- 航线 -->
  <path d="M170 210 Q 256 160 342 210" stroke="#63ec13" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M170 302 Q 256 352 342 302" stroke="#63ec13" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- 纵向航线 -->
  <path d="M210 170 Q 160 256 210 342" stroke="#708961" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M302 170 Q 352 256 302 342" stroke="#708961" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- 中心点 - 奇点 -->
  <circle cx="256" cy="256" r="28" fill="#63ec13"/>
  <circle cx="256" cy="256" r="44" stroke="#63ec13" stroke-width="6" fill="white"/>

  <!-- AI 星点 -->
  <circle cx="190" cy="190" r="10" fill="#63ec13"/>
  <circle cx="322" cy="190" r="8" fill="#63ec13" opacity="0.8"/>
  <circle cx="190" cy="322" r="8" fill="#63ec13" opacity="0.8"/>
  <circle cx="322" cy="322" r="10" fill="#63ec13"/>
</svg>
